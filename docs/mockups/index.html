<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gymLog — Mockup (bozza di stile)</title>
<style>
  :root{
    --bg:#050408; --ink:#f5f2ff; --mut:#9d96b8; --dim:#6b6585;
    --v1:#8b5cf6; --v2:#a78bfa; --v3:#c084fc; --vdeep:#3b1d8f;
    --ok:#34d399; --late:#ff6b8a;
    --glass:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
    --edge:rgba(255,255,255,.13);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0912;color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding:32px 16px 64px}
  h1{font-size:20px;font-weight:700;text-align:center}
  .sub{color:var(--mut);text-align:center;font-size:13px;margin:6px auto 28px;max-width:640px;line-height:1.5}
  .grid{display:flex;flex-wrap:wrap;gap:40px;justify-content:center}
  figure{display:flex;flex-direction:column;align-items:center;gap:12px}
  figcaption{font-size:13px;color:var(--mut)}
  figcaption b{color:var(--ink)}

  /* telefono */
  .phone{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:var(--bg);
    border:1px solid #2a2540;box-shadow:0 30px 80px rgba(80,40,200,.25),0 0 0 6px #120f1d}
  .phone::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(420px 320px at 85% -5%,rgba(139,92,246,.55),transparent 65%),
      radial-gradient(380px 360px at -10% 55%,rgba(168,85,247,.28),transparent 65%),
      radial-gradient(300px 300px at 90% 105%,rgba(91,33,182,.45),transparent 65%)}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:5}
  .status{position:absolute;top:16px;left:34px;right:34px;display:flex;justify-content:space-between;font-size:15px;font-weight:600;z-index:4}
  .screen{position:absolute;inset:0;padding:64px 18px 0;overflow:hidden}

  /* glass */
  .glass{background:var(--glass);border:1px solid var(--edge);border-radius:22px;
    backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 24px rgba(0,0,0,.35)}
  .violet{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:1px solid rgba(255,255,255,.22);
    box-shadow:0 8px 28px rgba(139,92,246,.45),inset 0 1px 0 rgba(255,255,255,.3)}

  .title{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--v2);font-weight:600}
  .mut{color:var(--mut)} .dim{color:var(--dim)}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;
    background:rgba(139,92,246,.18);border:1px solid rgba(167,139,250,.35);color:#d9ccff}
  .chip.t{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:var(--mut)}
  svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* tab bar */
  .tabs{position:absolute;left:14px;right:14px;bottom:22px;height:68px;border-radius:30px;display:flex;justify-content:space-around;align-items:center;z-index:6}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--dim);font-weight:600;width:76px;padding:6px 0;border-radius:20px}
  .tab.on{color:#fff;background:rgba(139,92,246,.30);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}

  /* home */
  .day{display:flex;align-items:center;gap:14px;padding:16px;margin-top:12px}
  .badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
  .day h3{font-size:17px;font-weight:700}
  .day p{font-size:12.5px;color:var(--mut);margin-top:3px}
  .banner{display:flex;gap:10px;align-items:center;padding:12px 14px;font-size:12.5px;margin-top:12px;color:#e7defd}

  /* sessione */
  .top{display:flex;justify-content:space-between;align-items:center}
  .elapsed{font-size:44px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
  .endbtn{padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;color:#fff}
  .ex{padding:14px;margin-top:12px}
  .ex.collapsed{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
  .ex h4{font-size:16px;font-weight:700}
  .row{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
  .row .n{font-size:13px;color:var(--mut);text-align:center;font-weight:700}
  .field{height:46px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.10);
    display:flex;align-items:center;justify-content:center;gap:5px;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .field small{font-size:11px;color:var(--mut);font-weight:600}
  .field.sug{color:#a99cd6}
  .field.cur{border-color:var(--v2);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
  .ck{height:46px;border-radius:14px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.14);color:var(--dim);background:rgba(255,255,255,.05)}
  .ck.done{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border-color:rgba(255,255,255,.3);box-shadow:0 4px 14px rgba(139,92,246,.5)}
  .row.done .field{color:#fff;background:rgba(139,92,246,.14);border-color:rgba(167,139,250,.35)}
  .tot{font-size:11px;color:var(--mut);margin-top:6px;padding-left:34px}
  .ss{position:relative;margin-top:12px;padding-left:14px}
  .ss::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:4px;background:linear-gradient(180deg,#c084fc,#6d28d9)}
  .ss .ex{margin-top:8px}
  .ss .ex:first-child{margin-top:0}
  .rest{position:absolute;left:14px;right:14px;bottom:104px;padding:14px 16px;z-index:6;display:flex;align-items:center;gap:14px;
    border-color:rgba(255,107,138,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 30px rgba(255,107,138,.25)}
  .ring{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:conic-gradient(var(--late) 0 100%,rgba(255,255,255,.08) 0);}
  .ring i{width:50px;height:50px;border-radius:50%;background:#0d0a18;display:block}
  .time{font-size:34px;font-weight:800;color:var(--late);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
  .rest .l{font-size:11px;color:var(--mut);margin-top:3px}
  .pm{width:46px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07)}

  /* editor */
  .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:14px 0 7px}
  .inp{height:48px;border-radius:15px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);padding:0 14px;display:flex;align-items:center;font-size:17px;font-weight:600}
  .seg{display:flex;padding:4px;border-radius:15px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
  .seg span{flex:1;text-align:center;padding:10px 0;font-size:13px;font-weight:600;color:var(--mut);border-radius:11px}
  .seg span.on{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;box-shadow:0 4px 14px rgba(139,92,246,.45)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .setrow{display:grid;grid-template-columns:22px 1fr 112px;gap:8px;align-items:center;margin-top:7px}
  .setrow .field{height:42px;font-size:17px}
  .toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-top:8px;font-size:14px;font-weight:600}
  .sw{width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.12);position:relative}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff}
  .sw.on{background:var(--v1)} .sw.on::after{left:21px}

  /* calendario */
  .cal{padding:14px;margin-top:14px}
  .cal .h{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--dim);font-weight:700;margin-bottom:6px}
  .cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .d{aspect-ratio:1/1.12;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--mut)}
  .d.today{outline:1px solid var(--v2);color:#fff}
  .d.sel{background:rgba(139,92,246,.30);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
  .d b{font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff}
  .d.o{opacity:.3}

  /* fine */
  .big{font-size:64px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1;
    background:linear-gradient(180deg,#fff,#b9a3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
  .stat{padding:14px 10px;text-align:center}
  .stat b{display:block;font-size:24px;font-weight:800}
  .stat span{font-size:11px;color:var(--mut)}
  .cta{height:56px;border-radius:20px;display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff;margin-top:16px}

  /* schede */
  .prog{padding:16px;margin-top:12px}
  .prog h3{font-size:18px;font-weight:700}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 10px var(--ok)}
</style>
</head>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></symbol>

</svg>

<h1>gymLog — bozza di stile</h1>
<p class="sub">Mockup statici per decidere insieme l'aspetto: nero profondo, viola, vetro smerigliato. Non è l'app: i dati sono inventati, il layout è indicativo. Tutte le schermate sono in italiano e pensate per il pollice (azioni principali in basso).</p>

<div class="grid">

<!-- 1. OGGI -->
<figure>
<div class="phone"><div class="island"></div><div class="status"><span>9:41</span><span>●●● 5G</span></div>
<div class="screen">
  <div class="kick">Sabato 4 ottobre</div>
  <div class="title" style="margin-top:4px">Cosa alleni oggi?</div>
  <div class="glass" style="padding:14px 16px;margin-top:16px;display:flex;justify-content:space-between;align-items:center">
    <div><div class="mut" style="font-size:12px">Scheda attiva</div><div style="font-weight:700;font-size:16px;margin-top:2px">Ipertrofia · Ott–Nov</div></div>
    <span class="chip">Settimana 1</span>
  </div>
  <div class="glass day"><div class="badge violet">A</div><div style="flex:1"><h3>Petto e spalle</h3><p>8 esercizi · ultima volta 3 giorni fa</p></div><svg class="i dim"><use href="#i-chev"/></svg></div>
  <div class="glass day"><div class="badge glass">B</div><div style="flex:1"><h3>Gambe</h3><p>8 esercizi · ultima volta 5 giorni fa</p></div><svg class="i dim"><use href="#i-chev"/></svg></div>
  <div class="glass day"><div class="badge glass">C</div><div style="flex:1"><h3>Schiena e tricipiti</h3><p>7 esercizi · ultima volta 7 giorni fa</p></div><svg class="i dim"><use href="#i-chev"/></svg></div>
  <div class="glass day"><div class="badge glass">D</div><div style="flex:1"><h3>Spalle e bicipiti</h3><p>8 esercizi · ultima volta 9 giorni fa</p></div><svg class="i dim"><use href="#i-chev"/></svg></div>
  <div class="glass banner"><span class="chip">Backup</span> Ultimo salvataggio 16 giorni fa. Salvalo ora.</div>
</div>
<div class="glass tabs">
  <div class="tab on"><svg class="i"><use href="#i-home"/></svg>Oggi</div>
  <div class="tab"><svg class="i"><use href="#i-list"/></svg>Schede</div>
  <div class="tab"><svg class="i"><use href="#i-cal"/></svg>Calendario</div>
  <div class="tab"><svg class="i"><use href="#i-gear"/></svg>Altro</div>
</div></div>

</div>
<div class="glass tabs">
  <div class="tab on"><svg class="i"><use href="#i-home"/></svg>Oggi</div>
  <div class="tab"><svg class="i"><use href="#i-list"/></svg>Schede</div>
  <div class="tab"><svg class="i"><use href="#i-cal"/></svg>Calendario</div>

<!-- 3. EDITOR ESERCIZIO -->
<figure>
<div class="phone"><div class="island"></div><div class="status"><span>9:41</span><span>●●● 5G</span></div>
<div class="screen">
  <div class="kick">Giorno A · esercizio 1</div>

  <div class="setrow"><div class="n mut" style="text-align:center">1</div><div class="field">8</div><div class="chip t" style="justify-content:center;height:42px;border-radius:14px">Normale</div></div>
  <div class="setrow"><div class="n mut" style="text-align:center">2</div><div class="field">8</div><div class="chip t" style="justify-content:center;height:42px;border-radius:14px">Normale</div></div>
  <div class="setrow"><div class="n mut" style="text-align:center">3</div><div class="field">6</div><div class="chip t" style="justify-content:center;height:42px;border-radius:14px">Normale</div></div>

<!-- 4. CALENDARIO -->
<figure>
<div class="phone"><div class="island"></div><div class="status"><span>9:41</span><span>●●● 5G</span></div>
<div class="screen">
  <div class="kick">Calendario</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><div class="title" style="font-size:28px">Ottobre 2026</div><div class="mut" style="font-size:22px">‹  ›</div></div>
  <div class="glass cal">
    <div class="h"><span>L</span><span>M</span><span>M</span><span>G</span><span>V</span><span>S</span><span>D</span></div>
    <div class="g">
      <div class="d o"></div><div class="d o"></div><div class="d o"></div><div class="d"><span>1</span><b>A</b></div><div class="d"><span>2</span></div><div class="d sel"><span>3</span><b>B</b></div><div class="d today"><span>4</span></div>
      <div class="d"><span>5</span><b>C</b></div><div class="d"><span>6</span></div><div class="d"><span>7</span><b>D</b></div><div class="d"><span>8</span></div><div class="d"><span>9</span><b>A</b></div><div class="d"><span>10</span></div><div class="d"><span>11</span></div>
      <div class="d"><span>12</span><b>B</b></div><div class="d"><span>13</span></div><div class="d"><span>14</span><b>C</b></div><div class="d"><span>15</span></div><div class="d"><span>16</span><b>D</b></div><div class="d"><span>17</span></div><div class="d"><span>18</span></div>
      <div class="d"><span>19</span><b>A</b></div><div class="d"><span>20</span></div><div class="d"><span>21</span><b>B</b></div><div class="d"><span>22</span></div><div class="d"><span>23</span><b>C</b></div><div class="d"><span>24</span></div><div class="d"><span>25</span></div>
